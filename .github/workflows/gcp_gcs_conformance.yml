name: GCP GCS Conformance

# Ephemeral GCP conformance lane for cmd/conformance/objstore: authenticate
# keyless via Workload Identity Federation, `terragrunt apply` a per-run Cloud
# SQL (MySQL) instance and create a per-run GCS bucket, run the objstore
# conformance server (gcsblob driver, gs:// blob_url) coordinated by that MySQL,
# drive the hammer, then tear everything down in always() steps so nothing leaks.
#
# All GCP access is keyless: Actions federates via WIF (google-github-actions/auth);
# the GCS client and Cloud SQL Auth Proxy both use the resulting Application
# Default Credentials. The MySQL login uses a per-run generated password (masked)
# held only in the run's ephemeral tfstate.
#
# PRs opt in via the 'run-gcs-conformance' label; unset/false GCP_CONFORMANCE_ENABLED
# skips the lane (workflow_dispatch and push always run when enabled). See
# deployment/README.md#enabling-the-gcp-conformance-lane. Required repo Variables:
#   vars.GCP_CONFORMANCE_ENABLED - "true" to enable this lane; unset/false skips it.
#   vars.GCP_PROJECT_ID          - project hosting the GCS bucket and Cloud SQL instance.
#   vars.GCP_REGION              - region for the bucket and the Cloud SQL instance.
#   vars.GCP_CI_SA_EMAIL         - CI service account email (impersonated via WIF).
#   vars.GCP_WIF_PROVIDER        - full Workload Identity provider resource name.

on:
  # 'labeled' lets adding the 'run-gcs-conformance' label trigger a run without a
  # new push (opt-in gate is the job's `if` below).
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for WIF/OIDC

concurrency:
  # Per-PR group (github.ref) so distinct PRs don't cancel each other. Runs are
  # isolated by TESSERA_CI_RUN_ID (per-run bucket, Cloud SQL instance, tfstate
  # prefix), so they never contend.
  group: gcs-conformance-${{ github.ref }}
  cancel-in-progress: false

env:
  TOFU_VERSION: "1.10.0"
  TG_VERSION: "0.77.22"
  TERRAGRUNT_TFPATH: tofu
  TG_DIR: deployment/live/gcp/ci-mysql
  GOOGLE_PROJECT: ${{ vars.GCP_PROJECT_ID }}
  GOOGLE_REGION: ${{ vars.GCP_REGION }}
  TESSERA_CI_SA_EMAIL: ${{ vars.GCP_CI_SA_EMAIL }}
  # Scopes the per-run bucket, SQL instance, and tfstate.
  TESSERA_CI_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  conformance:
    runs-on: ubuntu-latest
    # Opt-in on two axes (skipped otherwise, a neutral check):
    #   1. vars.GCP_CONFORMANCE_ENABLED == "true".
    #   2. pull_request also requires the 'run-gcs-conformance' label; a per-run
    #      Cloud SQL instance is too costly to run on every push. push and
    #      workflow_dispatch run whenever the lane is enabled.
    if: >-
      vars.GCP_CONFORMANCE_ENABLED == 'true' &&
      (github.event_name != 'pull_request' ||
       contains(github.event.pull_request.labels.*.name, 'run-gcs-conformance'))
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Authenticate to GCP (keyless, WIF)
        id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.7
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SA_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1

      - name: Install OpenTofu and Terragrunt
        run: |
          # Install directly (not the Docker terragrunt action) so the google
          # provider and Cloud SQL proxy can use the WIF-derived ADC on the runner.
          # Create the install dir first: unzip -d / curl -o won't create a missing
          # parent (~/.local may not exist).
          mkdir -p "${HOME}/.local/bin"
          curl -fsSL -o /tmp/tofu.zip \
            "https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}/tofu_${TOFU_VERSION}_linux_amd64.zip"
          unzip -q -o /tmp/tofu.zip tofu -d "${HOME}/.local/bin"
          curl -fsSL -o "${HOME}/.local/bin/terragrunt" \
            "https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/terragrunt_linux_amd64"
          chmod +x "${HOME}/.local/bin/tofu" "${HOME}/.local/bin/terragrunt"
          echo "${HOME}/.local/bin" >> "$GITHUB_PATH"

      - name: Generate ephemeral DB password
        run: |
          # Generated on the runner so it can be masked before reaching terraform.
          # Alphanumeric so it embeds cleanly in a MySQL DSN.
          PW="$(openssl rand -hex 24)"
          echo "::add-mask::${PW}"
          echo "DB_PASSWORD=${PW}" >> "$GITHUB_ENV"

      - name: Terragrunt apply ephemeral Cloud SQL
        env:
          TF_VAR_db_password: ${{ env.DB_PASSWORD }}
        run: |
          cd "${TG_DIR}"
          terragrunt apply -auto-approve --terragrunt-non-interactive
          {
            echo "SQL_CONNECTION=$(terragrunt output -raw connection_name)"
            echo "DB_NAME=$(terragrunt output -raw db_name)"
            echo "DB_USER=$(terragrunt output -raw db_user)"
          } >> "$GITHUB_ENV"

      - name: Create per-run GCS bucket
        run: |
          BUCKET="tessera-ci-${TESSERA_CI_RUN_ID}"
          echo "BUCKET=${BUCKET}" >> "$GITHUB_ENV"
          gcloud storage buckets create "gs://${BUCKET}" \
            --location="${GOOGLE_REGION}" --uniform-bucket-level-access

      - name: Start Cloud SQL Auth Proxy
        run: |
          # Password auth (no --auto-iam-authn): the proxy opens the tunnel with
          # the CI SA's ADC (roles/cloudsql.client); the MySQL login uses the
          # generated password. Runs in the background; log dumped on failure.
          curl -fsSL -o cloud-sql-proxy \
            https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.1/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy --port 3306 "${SQL_CONNECTION}" \
            >"${{ runner.temp }}/cloud-sql-proxy.log" 2>&1 &
          echo "PROXY_PID=$!" >> "$GITHUB_ENV"
          echo "Waiting for Cloud SQL Auth Proxy on 127.0.0.1:3306..."
          for i in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/3306) >/dev/null 2>&1 && { echo "Proxy is up."; break; }
            sleep 1
          done

      - name: Generate ephemeral log keys
        run: |
          go run github.com/transparency-dev/serverless-log/cmd/generate_keys@80334bc9dc573e8f6c5b3694efad6358da50abd4 \
            --key_name=tessera/ci \
            --out_priv="${{ runner.temp }}/key.sec" \
            --out_pub="${{ runner.temp }}/key.pub"
          echo "TESSERA_SIGNER=$(cat ${{ runner.temp }}/key.sec)" >> "$GITHUB_ENV"
          echo "TESSERA_VERIFIER=$(cat ${{ runner.temp }}/key.pub)" >> "$GITHUB_ENV"

      - name: Run conformance server (background)
        run: |
          # gs:// blob_url selects the gcsblob driver (native ADC auth); MySQL
          # coordination goes through the Auth Proxy on localhost. allowCleartext
          # is safe over the loopback hop, which the proxy TLS-encrypts to Cloud SQL.
          MYSQL_URI="${DB_USER}:${DB_PASSWORD}@tcp(127.0.0.1:3306)/${DB_NAME}?parseTime=true&allowCleartextPasswords=true"
          echo "Starting conformance server against bucket=${BUCKET} db=${DB_NAME} as user=${DB_USER}"
          go run ./cmd/conformance/objstore \
            --blob_url="gs://${BUCKET}" \
            --mysql_uri="${MYSQL_URI}" \
            --signer="${TESSERA_SIGNER}" \
            --listen=:2024 >"${{ runner.temp }}/conformance.log" 2>&1 &
          echo "CONFORMANCE_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for log to be ready
        run: |
          # The hammer reads the log directly from GCS, so wait until the server
          # publishes the initial (size-0) checkpoint, confirming it can write to GCS.
          TOKEN="$(gcloud auth print-access-token)"
          echo "Waiting for checkpoint at gs://${BUCKET}/checkpoint ..."
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${TOKEN}" \
              "https://storage.googleapis.com/${BUCKET}/checkpoint")
            if [ "$code" = "200" ]; then
              echo "Checkpoint is available."
              exit 0
            fi
            if ! kill -0 "${CONFORMANCE_PID}" 2>/dev/null; then
              echo "Conformance server exited prematurely. Logs:"
              cat "${{ runner.temp }}/conformance.log" || true
              exit 1
            fi
            sleep 2
          done
          echo "Timed out waiting for the initial checkpoint. Conformance server logs:"
          cat "${{ runner.temp }}/conformance.log" || true
          exit 1

      - name: Run hammer
        run: |
          # Reads come from the GCS bucket (CI SA access token); writes go to the
          # server's POST /add. The hammer's exit code is this job's pass/fail signal.
          go run ./internal/hammer \
            --log_url="https://storage.googleapis.com/${BUCKET}/" \
            --write_log_url="http://localhost:2024/" \
            --log_public_key="${TESSERA_VERIFIER}" \
            --bearer_token="$(gcloud auth print-access-token)" \
            --num_writers=8 \
            --max_write_ops=200 \
            --num_readers_random=2 \
            --num_readers_full=2 \
            --leaf_min_size=512 \
            --leaf_write_goal=1000 \
            --max_runtime=5m \
            --show_ui=false

      - name: Dump server and proxy logs
        if: always()
        run: |
          echo "===== conformance server log ====="
          cat "${{ runner.temp }}/conformance.log" || true
          echo "===== cloud-sql-proxy log ====="
          cat "${{ runner.temp }}/cloud-sql-proxy.log" || true

      - name: Stop conformance server and proxy
        if: always()
        run: |
          # Release DB connections before the instance is destroyed.
          [ -n "${CONFORMANCE_PID}" ] && kill "${CONFORMANCE_PID}" 2>/dev/null || true
          [ -n "${PROXY_PID}" ] && kill "${PROXY_PID}" 2>/dev/null || true

      - name: Delete per-run GCS bucket
        if: always()
        run: |
          [ -n "${BUCKET}" ] && gcloud storage rm -r "gs://${BUCKET}" --quiet || true

      - name: Terragrunt destroy ephemeral Cloud SQL
        if: always()
        env:
          TF_VAR_db_password: ${{ env.DB_PASSWORD }}
        run: |
          # Never leak the instance. Runs even after failures; a no-op if apply
          # created nothing.
          cd "${TG_DIR}"
          terragrunt destroy -auto-approve --terragrunt-non-interactive || true
